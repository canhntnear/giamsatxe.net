/* Thêm vào phần <style> */
html { scroll-behavior: smooth; }

/* Hiệu ứng rung nhẹ cho nút Zalo trên mobile để thu hút sự chú ý */
@keyframes subtle-shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
}

.btn-zalo {
    position: relative;
    overflow: hidden;
}

.btn-zalo::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: rotate(45deg);
    animation: shine 3s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}

/* Cải thiện khả năng đọc trên thiết bị di động */
@media (max-width: 768px) {
    .highlight-grid, .grid-3 { gap: 1rem; }
    .phone-group { flex-direction: column; }
    .phone-highlight { text-align: center; width: 100%; }
}
